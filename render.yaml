services:
  - type: web
    name: bwillz-family-sportsbook
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PIN
        sync: false
      - key: STARTING_BALANCE
        value: "1000"
      - key: INITIAL_ROSTER
        sync: false
